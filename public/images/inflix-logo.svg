<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 132 26" fill="none" aria-hidden="true">
  <!-- Blue: opening bracket -->
  <text x="0" y="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0052CC">&lt;</text>
  <!-- Black: "inflix" (full word; i-dot drawn separately in blue) -->
  <text x="16" y="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#000000">inflix</text>
  <!-- Blue dot over the "i" in inflix (covers default black dot) -->
  <rect x="18" y="4" width="6" height="6" fill="#0052CC"/>
  <!-- Blue: "/>" closing -->
  <text x="98" y="20" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#0052CC">/&gt;</text>
</svg>
